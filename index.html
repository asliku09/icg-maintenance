<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f5f4f0">
  <title>ICG Real Estate | Çok Yakında</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 22px;
      background: #f5f4f0;
      color: #202b30;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    .mark {
      width: 66px; height: 66px; margin: 0 auto 26px;
      display: grid; place-items: center;
      border: 1px solid #b7a98c; border-radius: 50%;
      color: #9a8059; font-family: Georgia, serif;
      font-size: 23px; letter-spacing: -2px;
    }
    .brand {
      margin: 0; font-size: 13px; font-weight: 600;
      letter-spacing: .28em; text-transform: uppercase;
    }
    .rule { width: 42px; height: 1px; margin: 34px auto; background: #b7a98c; }
    h1 {
      margin: 0 auto 18px; max-width: 680px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 7vw, 62px); line-height: 1.08;
      font-weight: 400; letter-spacing: -.035em;
    }
    .message {
      max-width: 480px; margin: 0 auto;
      color: #657176; font-size: 16px; line-height: 1.8;
    }
    footer {
      margin-top: 76px; color: #929894;
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    }
    @media (max-width: 520px) {
      .rule { margin: 27px auto; }
      .message { font-size: 14px; }
      footer { margin-top: 58px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ICG</div>
    <p class="brand">ICG Real Estate</p>
    <div class="rule" aria-hidden="true"></div>
    <h1>Yeni web sitemizi hazırlıyoruz.</h1>
    <p class="message">
      Size daha iyi bir deneyim sunmak için dijital yüzümüzü yeniliyoruz.
      Çok yakında yeniden buradayız.
    </p>
    <footer>İstanbul · ICG Real Estate</footer>
  </main>
</body>
</html>
